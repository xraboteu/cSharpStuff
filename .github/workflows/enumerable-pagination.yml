name: Enumerable pagination example
on:
  push:
    paths:
      - 'examples/EnumerablePagination/**'
      - '.github/workflows/enumerable-pagination.yml'
  pull_request:
    paths:
      - 'examples/EnumerablePagination/**'
      - '.github/workflows/enumerable-pagination.yml'
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build examples/EnumerablePagination/EnumerablePagination.csproj -c Release
      - name: Smoke test
        shell: bash
        run: |
          output="$(dotnet run --no-build -c Release --project examples/EnumerablePagination/EnumerablePagination.csproj)"
          printf '%s\n' "$output"
          expected=$'Id=3, Date=2026-10-13, Price=10\nId=2, Date=2026-10-13, Price=30'
          test "$output" = "$expected"
